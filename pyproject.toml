[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulador-energia-marina"
version = "0.1.0"
description = "Simulador educativo de energia undimotriz y mareomotriz - FCN030 UTS 2026-2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "utide>=0.4",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pywebview>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
    "black>=23",
    "playwright>=1.45",  # suite e2e de la app web (tarea 2.*); requiere `playwright install chromium`
    "statsmodels>=0.13",  # dependencia transitiva de mhkit (oráculo JONSWAP IEC TS 62600-100)
    "mhkit>=3; python_version<'3.12'",  # oráculo de rendimiento (validacion-referencia)
    "wavespectra>=3",  # oráculo de espectros (validacion-referencia)
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "C90"]
ignore = ["E501", "F841"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["nucleo", "analisis", "app", "datos"]
